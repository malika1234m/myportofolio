<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark terminal background -->
  <rect width="64" height="64" rx="10" fill="#0d0d0d"/>

  <!-- Scanline overlay effect -->
  <rect width="64" height="1.5" y="16" fill="#00ff41" opacity="0.06"/>
  <rect width="64" height="1.5" y="32" fill="#00ff41" opacity="0.06"/>
  <rect width="64" height="1.5" y="48" fill="#00ff41" opacity="0.06"/>

  <!-- Terminal prompt > -->
  <text x="9" y="40" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#00ff41" opacity="0.95">&#62;_</text>

  <!-- Blinking cursor block -->
  <rect x="42" y="22" width="11" height="17" rx="1" fill="#00ff41" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Green glow border -->
  <rect x="1" y="1" width="62" height="62" rx="10" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.3"/>
</svg>
